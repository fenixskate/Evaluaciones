name: Optional quality matrix
on:
  workflow_dispatch:
jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:quality -- --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-${{ matrix.browser }}
          path: reports/quality
